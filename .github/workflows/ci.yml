name: CI

on:
  push:
    paths:
      - 'km/backend/**'
      - 'km/frontend/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'km/backend/**'
      - 'km/frontend/**'
      - '.github/workflows/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: km/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # winsdk 仅支持 Windows，CI 只装测试所需子集
      - run: pip install "fastapi>=0.110" "uvicorn[standard]>=0.29" "pydantic>=2.5" "httpx>=0.27" coverage
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          python -m coverage run --source=app -m unittest discover -s tests -v > ci-test.log 2>&1
          test_status=$?
          python -m coverage report --fail-under=40 >> ci-test.log 2>&1
          report_status=$?
          # 把失败原因上报为 annotations，便于在运行详情中直接看到
          grep -nE "^(FAIL|ERROR|FAILED|OK|Ran )|Traceback|AssertionError|Error:|  File " ci-test.log | tail -60 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-400)
            echo "::error file=ci-test.log::$esc"
          done
          echo "--- test status: $test_status, coverage status: $report_status ---"
          tail -12 ci-test.log
          exit $(( test_status == 0 && report_status == 0 ? 0 : 1 ))

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: km/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: km/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-markdown.mjs
      - run: node scripts/test-clipboard.mjs
