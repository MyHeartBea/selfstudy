name: CI

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与 ruff 的 target-version（pyproject 里 py312）及本地开发环境对齐
          python-version: '3.12'
      # CI 只装跑测试必需的子集。python-docx / pypdf / Pillow 是可选依赖，没有它们时
      # 相关测试必须自行 skip（曾因缺 python-docx 导致 CI 变红）；winsdk 已在
      # requirements.txt 加 sys_platform 平台标记，Linux 上装整个文件也不会再失败
      - run: pip install "fastapi>=0.110" "uvicorn[standard]>=0.29" "pydantic>=2.5" "httpx>=0.27" coverage ruff
      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Run backend tests
        shell: bash
        # 给一个假 key：CI 没有 backend/.env，`is_configured()` 会为 False，
        # 涉及 AI 的端点会提前返回 400。测试自己也会打桩，这里再兜一层，
        # 避免以后新增测试又踩同一个坑。
        env:
          AI_API_KEY: ci-dummy-key
          AI_VISION_API_KEY: ci-dummy-key
        run: |
          coverage run -m unittest discover -s tests -v
          # 2026-09-26 实测 CI 口径约 79%（盲区测试补齐后），门槛设 70% 留出
          # CI 缺 Pillow/pypdf 时相关测试 skip 的余量（此前 55% 偏松）
          coverage report --fail-under=70

  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Lint (eslint + prettier)
        run: |
          npx eslint src tests e2e playwright.config.js vite.config.js
          npx prettier --check "src/**/*.{js,vue,css}" "tests/**/*.js" "e2e/**/*.js" "playwright.config.js" "vite.config.js"
      # 原先只 build、不跑测试：卡片点击 / 知识点弹窗 / 关联错题区 这些
      # DOM 级回归（happy-dom + @vue/test-utils）在 CI 里从未被验证
      - name: Run frontend tests
        run: npm test
      # build 必须保留：Vue 模板编译错误只有 build 能发现（lint 与单测都会放过）
      - name: Build frontend
        run: npm run build

  # v3 沉浸式前端（frontend-v3）：已于 2026-09-22 整体删除（旧原型，2026-09-17 后
  # 停止演进；其质量门禁连续报红没有维护价值）。目录与专用脚本一并清理，
  # 需要时按 git 历史可整体恢复。

  # 真浏览器 E2E：命中测试（整块可点）与真实 paste 事件只有这里能覆盖。
  # 自己起 vite dev（Playwright webServer），所有 /api 在浏览器层打桩，不需要后端。
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      # CI 必须有真浏览器：装 Playwright 自带 chromium（本机开发时用系统 Chrome，不下载）
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (card click + capture)
        run: npm run test:e2e
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # 报告与 test-results（trace/截图）都传：报告未生成时仍有原始证据
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

