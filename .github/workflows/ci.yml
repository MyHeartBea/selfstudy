name: CI

on:
  push:
    paths:
      - 'km/backend/**'
      - 'km/frontend/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'km/backend/**'
      - 'km/frontend/**'
      - '.github/workflows/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: km/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # winsdk 仅支持 Windows，CI 只装测试所需子集
      - run: pip install "fastapi>=0.110" "uvicorn[standard]>=0.29" "pydantic>=2.5" "httpx>=0.27" coverage
      - run: python -m coverage run --source=app -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=40

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: km/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: km/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-markdown.mjs
      - run: node scripts/test-clipboard.mjs
