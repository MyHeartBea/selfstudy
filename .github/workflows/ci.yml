name: CI

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # CI 只装跑测试必需的子集。python-docx / pypdf / Pillow / winsdk 是 Windows 侧
      # 可选依赖，没有它们时相关测试必须自行 skip（曾因缺 python-docx 导致 CI 变红）
      - run: pip install "fastapi>=0.110" "uvicorn[standard]>=0.29" "pydantic>=2.5" "httpx>=0.27" coverage ruff
      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Run backend tests
        shell: bash
        # 给一个假 key：CI 没有 backend/.env，`is_configured()` 会为 False，
        # 涉及 AI 的端点会提前返回 400。测试自己也会打桩，这里再兜一层，
        # 避免以后新增测试又踩同一个坑。
        env:
          AI_API_KEY: ci-dummy-key
          AI_VISION_API_KEY: ci-dummy-key
        run: |
          coverage run -m unittest discover -s tests -v
          # 实际覆盖率约 62%，门槛设 55% 留出波动余量（此前 35% 形同虚设）
          coverage report --fail-under=55

  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Lint (eslint + prettier)
        run: |
          npx eslint src tests e2e playwright.config.js vite.config.js
          npx prettier --check "src/**/*.{js,vue,css}" "tests/**/*.js" "e2e/**/*.js" "playwright.config.js" "vite.config.js"
      # 原先只 build、不跑测试：卡片点击 / 知识点弹窗 / 关联错题区 这些
      # DOM 级回归（happy-dom + @vue/test-utils）在 CI 里从未被验证
      - name: Run frontend tests
        run: npm test
      # build 必须保留：Vue 模板编译错误只有 build 能发现（lint 与单测都会放过）
      - name: Build frontend
        run: npm run build

  # v3 沉浸式前端（frontend-v3）：与 v2 完全独立的一套依赖与配置。
  # 并行期间后端仍服务 v2 的 dist，v3 这里只做质量门禁。
  frontend-v3-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Lint (eslint + prettier)
        run: |
          npx eslint src tests vite.config.js
          npx prettier --check "src/**/*.{js,vue,css}" "tests/**/*.js" "vite.config.js"
      - name: Run tests
        run: npm test
      # v3 的 Vue 模板编译错误同样只有 build 能发现
      - name: Build v3
        run: npm run build
      # 性能预算：首屏体积与单块上限。chunkSizeWarningLimit 只打印警告，
      # 这里把它变成会让 CI 失败的硬断言（脚本从 dist/index.html 解析真实首屏资源）
      - name: Bundle budget
        working-directory: .
        run: python scripts/check_bundle_budget.py
      # 硬性要求逐条核验（18 项：隐喻/排版/OKLCH/动效/WebGL/光标/磁吸/滚动/
      # 悬停/Lucide/零 emoji/零 CDN/可访问性/reduced-motion/60fps/启动页/体积/v2 未动）
      - name: Verify requirements
        working-directory: .
        run: python scripts/verify_requirements.py

  # v3 真浏览器 E2E（Playwright，独立端口 5176）
  # 后端不需要：E2E 里所有 /api 请求都用 page.route 打桩，所以 CI 里可独立运行。
  frontend-v3-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run v3 E2E
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3-playwright-report
          path: frontend-v3/playwright-report/
          retention-days: 7

  # 真浏览器 E2E：命中测试（整块可点）与真实 paste 事件只有这里能覆盖。
  # 自己起 vite dev（Playwright webServer），所有 /api 在浏览器层打桩，不需要后端。
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      # CI 必须有真浏览器：装 Playwright 自带 chromium（本机开发时用系统 Chrome，不下载）
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (card click + capture)
        run: npm run test:e2e
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # 报告与 test-results（trace/截图）都传：报告未生成时仍有原始证据
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

