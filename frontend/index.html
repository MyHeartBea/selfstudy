<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#c2402a" />
    <title>研错本 · 考研错题管理</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2402a'/%3E%3Ctext x='16' y='22' font-size='16' font-family='serif' fill='%23fffdf9' text-anchor='middle'%3E研%3C/text%3E%3C/svg%3E" />
    <style>
      /* ===== 启动屏：在任何 JS/CSS 资源加载前就开始播放 ===== */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f6f3ee;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: #16130f; }
      }
      .splash-seal {
        position: relative;
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: #c2402a;
        color: #fffdf9;
        font-family: Georgia, 'Songti SC', 'SimSun', serif;
        font-size: 44px;
        font-weight: 700;
        box-shadow: 0 18px 44px -14px rgba(194, 64, 42, 0.65);
        animation: seal-in 0.6s cubic-bezier(0.22, 1.2, 0.36, 1) both, seal-float 2.6s ease-in-out 0.7s infinite;
      }
      .splash-seal::after {
        content: '';
        position: absolute;
        inset: -7px;
        border: 1.5px solid rgba(194, 64, 42, 0.35);
        border-radius: 28px;
        animation: seal-ring 1.4s ease-out 0.25s both;
      }
      @keyframes seal-in {
        from { opacity: 0; transform: scale(0.55) rotate(-8deg); }
        to { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes seal-ring {
        from { opacity: 0; transform: scale(0.8); }
        60% { opacity: 1; }
        to { opacity: 0; transform: scale(1.35); }
      }
      @keyframes seal-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      .splash-title {
        font-family: Georgia, 'Songti SC', 'SimSun', serif;
        font-size: 22px;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        color: #211d18;
        animation: title-in 0.7s ease 0.25s both;
      }
      @media (prefers-color-scheme: dark) {
        .splash-title { color: #ece6da; }
      }
      @keyframes title-in {
        from { opacity: 0; transform: translateY(10px); letter-spacing: 0.6em; }
        to { opacity: 1; transform: translateY(0); letter-spacing: 0.35em; }
      }
      .splash-bar {
        width: 168px;
        height: 3px;
        border-radius: 99px;
        background: rgba(33, 29, 24, 0.1);
        overflow: hidden;
        animation: title-in 0.7s ease 0.35s both;
      }
      .splash-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, transparent, #c2402a 40%, #c2402a);
        animation: bar-run 1.1s ease-in-out infinite;
      }
      @keyframes bar-run {
        from { transform: translateX(-110%); }
        to { transform: translateX(430%); }
      }
      .splash-sub {
        font-size: 10.5px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #93897a;
        animation: title-in 0.7s ease 0.45s both;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-seal">研</div>
      <div class="splash-title">研错本</div>
      <div class="splash-bar"><i></i></div>
      <div class="splash-sub">Kaoyan Mistake Book</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
