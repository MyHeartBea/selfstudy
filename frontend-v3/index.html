<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>研错本 · 夜航星图</title>
<meta name="description" content="研错本 v3：未掌握的是暗，已掌握的是光。每题一颗星。" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#05060a" />
<style>
  /* 启动前的最小底色，防白闪。真正的"研墨开场"在 Vue 挂载后接管（见 src/app/loader.css）。 */
  html, body { margin: 0; background: #05060a; }
  #app { min-height: 100svh; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #05060a; color: #e7e6fb;
    font: 300 11px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .28em; text-transform: uppercase; opacity: .5;
  }
</style>
</head>
<body>
<div id="boot" aria-hidden="true">研错本</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
