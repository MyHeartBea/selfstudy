<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考研错题本</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <style>
    :root {
      --el-color-primary: #1f5aa8;
      --el-color-primary-light-3: #4c7dbc;
      --el-color-primary-light-5: #79a0d0;
      --el-color-primary-light-7: #a6c2e3;
      --el-color-primary-light-8: #bcd1ea;
      --el-color-primary-light-9: #e4edf7;
      --el-color-primary-dark-2: #194a88;
      --app-bg: #f4f7fb;
      --app-sidebar: #16395f;
      --app-sidebar-active: #2b6cb0;
      --app-border: #dfe7f0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--app-bg);
      color: #2b3440;
    }

    .layout {
      height: 100%;
    }

    .aside {
      background: var(--app-sidebar);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brand {
      padding: 22px 20px 18px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 12px;
      color: #b9cbe0;
    }

    .side-menu {
      flex: 1;
      border-right: none;
      background: transparent;
      padding-top: 8px;
    }

    .side-menu .el-menu-item {
      color: #c9d8ea;
      height: 48px;
      line-height: 48px;
      margin: 4px 10px;
      border-radius: 6px;
    }

    .side-menu .el-menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .side-menu .el-menu-item.is-active {
      background: var(--app-sidebar-active);
      color: #fff;
    }

    .main {
      background: var(--app-bg);
      padding: 22px;
      overflow: auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .page-header h2 {
      margin: 0;
      font-size: 22px;
      color: #1d3a5f;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .filter-card {
      border-radius: 8px;
      border: 1px solid var(--app-border);
      margin-bottom: 16px;
    }

    .filter-card .el-form-item {
      margin-bottom: 12px;
      margin-right: 14px;
    }

    .sort-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--app-border);
      padding-top: 12px;
    }

    .count-tip {
      color: #6b7a8c;
      font-size: 13px;
    }

    .mistake-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px;
    }

    .mistake-card {
      border-radius: 8px;
      border: 1px solid var(--app-border);
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .mistake-card:hover {
      box-shadow: 0 6px 18px rgba(31, 90, 168, 0.14);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .card-rate {
      margin-left: auto;
    }

    .question-text {
      margin: 0 0 12px;
      line-height: 1.6;
      min-height: 52px;
      color: #24344a;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 24px;
    }

    .tag-item {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eef2f7;
      color: #8a97a8;
      font-size: 12px;
    }

    .source {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 55%;
    }

    .pagination-wrap {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .detail-body {
      max-height: 62vh;
      overflow: auto;
      padding-right: 6px;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .question-block {
      background: #f2f6fb;
      border-left: 4px solid var(--el-color-primary);
      border-radius: 6px;
      padding: 14px 16px;
      line-height: 1.7;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #e6ebf2;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .option-row.correct {
      background: #edf8f1;
      border-color: #6ec79a;
    }

    .option-key {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e4eaf2;
      color: #34495e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .option-row.correct .option-key {
      background: #2e9e63;
      color: #fff;
    }

    .analysis-block {
      background: #fffaf0;
      border-radius: 6px;
      padding: 12px 14px;
      margin: 14px 0;
      line-height: 1.7;
    }

    .block-label {
      font-weight: 700;
      color: #8a6d1d;
      margin-bottom: 6px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
      padding: 12px 2px;
      color: #42536b;
      font-size: 14px;
    }

    .detail-collapse {
      margin-top: 8px;
    }

    .muted {
      color: #9aa7b5;
      font-size: 13px;
      margin: 8px 0;
    }

    .related-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #e6ebf2;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .related-card:hover {
      border-color: var(--el-color-primary);
      background: #f4f8fd;
    }

    .related-question {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #31445c;
    }

    .tag-editor {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .tag-chip {
      height: 28px;
      line-height: 26px;
    }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat-card {
      border-radius: 8px;
      padding: 20px 22px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-card.total {
      background: linear-gradient(135deg, #1f5aa8, #2b6cb0);
    }

    .stat-card.today {
      background: linear-gradient(135deg, #1d7f66, #2a9d7f);
    }

    .stat-value {
      font-size: 34px;
      font-weight: 800;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.92;
    }

    .subject-stats {
      border-radius: 8px;
      border: 1px solid var(--app-border);
    }

    .subject-stat-row {
      display: grid;
      grid-template-columns: 160px 1fr 190px;
      align-items: center;
      gap: 16px;
      padding: 14px 6px;
      border-bottom: 1px solid #eef2f7;
    }

    .subject-stat-row:last-child {
      border-bottom: none;
    }

    .subject-name {
      font-weight: 700;
      color: #1d3a5f;
    }

    .subject-nums {
      color: #64748b;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .subject-nums .avg {
      color: var(--el-color-primary);
      font-weight: 600;
    }

    .el-card {
      --el-card-border-radius: 8px;
    }

    @media (max-width: 900px) {
      .aside {
        width: 180px !important;
      }

      .info-grid,
      .subject-stat-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <el-container class="layout">
    <el-aside width="220px" class="aside">
      <div class="brand">
        <div class="brand-title">考研错题本</div>
        <div class="brand-sub">Kaoyan Mistake Book</div>
      </div>
      <el-menu :default-active="activeMenu" @select="handleMenuSelect" class="side-menu">
        <el-menu-item index="list">错题列表</el-menu-item>
        <el-menu-item index="create">录入错题</el-menu-item>
        <el-menu-item index="knowledge">知识点库</el-menu-item>
        <el-menu-item index="stats">统计</el-menu-item>
      </el-menu>
    </el-aside>
    <el-container>
      <el-main class="main">
        <mistake-list v-if="activeMenu === 'list'" />
        <mistake-form v-else-if="activeMenu === 'create'" @submitted="onCreated" />
        <knowledge-base v-else-if="activeMenu === 'knowledge'" />
        <stats-view v-else-if="activeMenu === 'stats'" />
      </el-main>
    </el-container>
  </el-container>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://unpkg.com/element-plus/dist/locale/zh-cn.min.js"></script>
<script>
const { createApp, reactive, ref, computed, watch, onMounted } = Vue;
const api = axios.create({ baseURL: "/api", timeout: 15000 });

const appState = reactive({
  subjects: [],
  subSubjects: [],
  subjectMap: {},
  subSubjectMap: {}
});

function subjectName(id) {
  return appState.subjectMap[id] || "通用";
}

function subSubjectName(id) {
  return appState.subSubjectMap[id] || "";
}

function subjectColor(id) {
  return {
    1: "#c0392b",
    2: "#d97706",
    3: "#2e7d32",
    4: "#1f5aa8"
  }[id] || "#64748b";
}

function truncate(text, length) {
  const value = String(text || "");
  return value.length > length ? value.slice(0, length) + "..." : value;
}

async function loadBaseData() {
  try {
    const [subjectRes, subSubjectRes] = await Promise.all([
      api.get("/subjects"),
      api.get("/sub_subjects")
    ]);
    appState.subjects = subjectRes.data.data || [];
    appState.subSubjects = subSubjectRes.data.data || [];
    appState.subjectMap = {};
    appState.subSubjectMap = {};
    appState.subjects.forEach((item) => { appState.subjectMap[item.id] = item.name; });
    appState.subSubjects.forEach((item) => { appState.subSubjectMap[item.id] = item.name; });
  } catch (err) {
    ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "加载基础数据失败");
  }
}

const MistakeList = {
  components: { MistakeForm },
  setup() {
    const loading = ref(false);
    const allMistakes = ref([]);
    const filters = reactive({
      subjectId: null,
      subSubjectId: null,
      difficulties: [],
      tag: "",
      approach: "",
      search: ""
    });
    const sortBy = ref("created_desc");
    const page = ref(1);
    const pageSize = ref(10);

    const detailVisible = ref(false);
    const detailLoading = ref(false);
    const detail = ref(null);
    const editVisible = ref(false);
    const editTarget = ref(null);
    const fileInput = ref(null);

    const subSubjectOptions = computed(() => {
      if (!filters.subjectId) return [];
      return appState.subSubjects.filter((item) => item.subject_id === filters.subjectId);
    });

    const filteredMistakes = computed(() => {
      let list = allMistakes.value.slice();
      if (filters.difficulties.length) {
        list = list.filter((item) => filters.difficulties.includes(item.difficulty));
      }
      if (sortBy.value === "difficulty_desc") {
        list.sort((a, b) => b.difficulty - a.difficulty || b.id - a.id);
      } else if (sortBy.value === "difficulty_asc") {
        list.sort((a, b) => a.difficulty - b.difficulty || b.id - a.id);
      } else {
        list.sort((a, b) => b.id - a.id);
      }
      return list;
    });

    const pagedMistakes = computed(() => {
      const start = (page.value - 1) * pageSize.value;
      return filteredMistakes.value.slice(start, start + pageSize.value);
    });

    const optionList = computed(() => {
      if (!detail.value) return [];
      return ["A", "B", "C", "D"].map((key) => ({
        key,
        text: detail.value["option_" + key.toLowerCase()]
      }));
    });

    async function loadMistakes() {
      loading.value = true;
      try {
        const params = {};
        if (filters.subjectId) params.subject_id = filters.subjectId;
        if (filters.subSubjectId) params.sub_subject_id = filters.subSubjectId;
        if (filters.tag) params.tag = filters.tag;
        if (filters.approach) params.approach = filters.approach;
        if (filters.search) params.search = filters.search;
        const res = await api.get("/mistakes", { params });
        allMistakes.value = res.data.data || [];
        page.value = 1;
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "加载错题失败");
      } finally {
        loading.value = false;
      }
    }

    function resetFilters() {
      filters.subjectId = null;
      filters.subSubjectId = null;
      filters.difficulties = [];
      filters.tag = "";
      filters.approach = "";
      filters.search = "";
      loadMistakes();
    }

    function onSubjectChange() {
      filters.subSubjectId = null;
    }

    async function loadDetail(id) {
      detailLoading.value = true;
      try {
        const res = await api.get(`/mistakes/${id}`);
        detail.value = res.data.data;
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "加载错题详情失败");
      } finally {
        detailLoading.value = false;
      }
    }

    function openDetail(id) {
      detailVisible.value = true;
      loadDetail(id);
    }

    function switchDetail(id) {
      loadDetail(id);
    }

    function openEdit() {
      if (!detail.value) return;
      editTarget.value = detail.value;
      editVisible.value = true;
    }

    function onEditSubmitted() {
      editVisible.value = false;
      loadMistakes();
      if (detail.value) {
        loadDetail(detail.value.id);
      }
    }

    async function deleteCurrent() {
      try {
        await ElMessageBox.confirm("确定删除这道错题吗？删除后不可恢复。", "删除确认", {
          type: "warning",
          confirmButtonText: "删除",
          cancelButtonText: "取消"
        });
      } catch (err) {
        return;
      }
      try {
        await api.delete(`/mistakes/${detail.value.id}`);
        ElMessage.success("删除成功");
        detailVisible.value = false;
        loadMistakes();
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "删除失败");
      }
    }

    async function exportJson() {
      try {
        const res = await api.get("/export");
        const payload = res.data.data;
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `考研错题本_${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        ElMessage.error("导出失败");
      }
    }

    function triggerImport() {
      if (fileInput.value) fileInput.value.click();
    }

    async function onImportFile(event) {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      let parsed;
      try {
        parsed = JSON.parse(await file.text());
      } catch (err) {
        ElMessage.error("JSON 文件解析失败");
        return;
      }
      const mistakes = Array.isArray(parsed) ? parsed : (parsed.mistakes || []);
      if (!mistakes.length) {
        ElMessage.warning("文件中没有可导入的错题");
        return;
      }
      try {
        const res = await api.post("/import", { mistakes });
        const result = res.data.data;
        ElMessage.success(`导入完成：成功 ${result.created} 条${result.failed.length ? `，失败 ${result.failed.length} 条` : ""}`);
        loadMistakes();
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "导入失败");
      }
    }

    onMounted(loadMistakes);

    return {
      loading,
      filters,
      sortBy,
      page,
      pageSize,
      allMistakes,
      filteredMistakes,
      pagedMistakes,
      subSubjectOptions,
      detailVisible,
      detailLoading,
      detail,
      editVisible,
      editTarget,
      fileInput,
      optionList,
      loadMistakes,
      resetFilters,
      onSubjectChange,
      openDetail,
      switchDetail,
      openEdit,
      onEditSubmitted,
      deleteCurrent,
      exportJson,
      triggerImport,
      onImportFile
    };
  },
  template: `
    <div class="page">
      <div class="page-header">
        <h2>错题列表</h2>
        <div class="header-actions">
          <el-button type="primary" plain @click="exportJson">导出 JSON</el-button>
          <el-button @click="triggerImport">导入 JSON</el-button>
          <input ref="fileInput" type="file" accept=".json,application/json" style="display:none" @change="onImportFile">
        </div>
      </div>

      <el-card shadow="never" class="filter-card">
        <el-form :inline="true">
          <el-form-item label="科目">
            <el-select v-model="filters.subjectId" clearable placeholder="全部科目" style="width:170px" @change="onSubjectChange">
              <el-option v-for="s in appState.subjects" :key="s.id" :label="s.name" :value="s.id" />
            </el-select>
          </el-form-item>
          <el-form-item label="二级科目">
            <el-select v-model="filters.subSubjectId" clearable placeholder="全部" style="width:170px" :disabled="!subSubjectOptions.length">
              <el-option v-for="s in subSubjectOptions" :key="s.id" :label="s.name" :value="s.id" />
            </el-select>
          </el-form-item>
          <el-form-item label="难度">
            <el-select v-model="filters.difficulties" multiple collapse-tags placeholder="全部难度" style="width:170px">
              <el-option v-for="n in [1,2,3,4,5]" :key="n" :label="'★'.repeat(n)" :value="n" />
            </el-select>
          </el-form-item>
          <el-form-item label="知识点">
            <el-input v-model="filters.tag" clearable placeholder="如：二叉树遍历" style="width:150px" />
          </el-form-item>
          <el-form-item label="思路">
            <el-input v-model="filters.approach" clearable placeholder="如：递归" style="width:140px" />
          </el-form-item>
          <el-form-item label="搜索">
            <el-input v-model="filters.search" clearable placeholder="搜索题干" style="width:170px" @keyup.enter="loadMistakes" />
          </el-form-item>
          <el-form-item>
            <el-button type="primary" :loading="loading" @click="loadMistakes">搜索</el-button>
            <el-button @click="resetFilters">重置</el-button>
          </el-form-item>
        </el-form>
        <div class="sort-row">
          <el-select v-model="sortBy" style="width:170px">
            <el-option label="按创建时间倒序" value="created_desc" />
            <el-option label="按难度从高到低" value="difficulty_desc" />
            <el-option label="按难度从低到高" value="difficulty_asc" />
          </el-select>
          <span class="count-tip">共 {{ filteredMistakes.length }} 条</span>
        </div>
      </el-card>

      <div v-loading="loading">
        <el-empty v-if="!filteredMistakes.length" description="暂无错题，去录入一道吧" />
        <div v-else class="mistake-grid">
          <el-card v-for="item in pagedMistakes" :key="item.id" shadow="hover" class="mistake-card" @click="openDetail(item.id)">
            <div class="card-top">
              <el-tag :color="subjectColor(item.subject_id)" effect="dark" style="color:#fff;border-color:transparent">{{ subjectName(item.subject_id) }}</el-tag>
              <el-tag v-if="item.sub_subject_id" type="info" effect="plain">{{ subSubjectName(item.sub_subject_id) }}</el-tag>
              <el-rate :model-value="item.difficulty" disabled size="small" class="card-rate" />
            </div>
            <p class="question-text">{{ truncate(item.question, 50) }}</p>
            <div class="tag-row">
              <el-tag v-for="t in item.knowledge_tags" :key="t" size="small" class="tag-item">{{ t }}</el-tag>
              <el-tag v-if="item.approach" size="small" type="info" class="tag-item">思路：{{ item.approach }}</el-tag>
            </div>
            <div class="card-foot">
              <span v-if="item.source" class="source">{{ item.source }}</span>
              <span v-else class="source"></span>
              <span>{{ item.created_at }}</span>
            </div>
          </el-card>
        </div>
      </div>

      <div v-if="filteredMistakes.length" class="pagination-wrap">
        <el-pagination
          background
          layout="total, sizes, prev, pager, next"
          :total="filteredMistakes.length"
          v-model:current-page="page"
          v-model:page-size="pageSize"
          :page-sizes="[6, 10, 20, 50]"
        />
      </div>

      <el-dialog v-model="detailVisible" title="错题详情" width="760px" top="5vh">
        <div v-loading="detailLoading" class="detail-body">
          <template v-if="detail">
            <div class="detail-meta">
              <el-tag :color="subjectColor(detail.subject_id)" effect="dark" style="color:#fff;border-color:transparent">{{ subjectName(detail.subject_id) }}</el-tag>
              <el-tag v-if="detail.sub_subject_id" type="info" effect="plain">{{ subSubjectName(detail.sub_subject_id) }}</el-tag>
              <el-rate :model-value="detail.difficulty" disabled />
            </div>
            <div class="question-block">{{ detail.question }}</div>
            <div v-for="opt in optionList" :key="opt.key" class="option-row" :class="{ correct: opt.key === detail.correct_answer }">
              <span class="option-key">{{ opt.key }}</span>
              <span>{{ opt.text || "（未填写）" }}</span>
              <el-tag v-if="opt.key === detail.correct_answer" type="success" size="small">正确答案</el-tag>
            </div>
            <div v-if="detail.analysis" class="analysis-block">
              <div class="block-label">解析</div>
              <p style="margin:0">{{ detail.analysis }}</p>
            </div>
            <div class="info-grid">
              <div><strong>难度：</strong>{{ detail.difficulty }} 星</div>
              <div><strong>解题思路：</strong>{{ detail.approach || "未填写" }}</div>
              <div><strong>来源：</strong>{{ detail.source || "未填写" }}</div>
              <div><strong>创建时间：</strong>{{ detail.created_at }}</div>
            </div>
            <el-collapse class="detail-collapse">
              <el-collapse-item title="知识点补充" name="knowledge">
                <p v-if="detail.knowledge_extra && detail.knowledge_extra.summary" style="line-height:1.7;margin:6px 0">{{ detail.knowledge_extra.summary }}</p>
                <p v-else class="muted">暂无补充，可前往知识点库添加。</p>
              </el-collapse-item>
              <el-collapse-item :title="'同知识点错题（' + detail.related_mistakes.length + '）'" name="related">
                <div v-if="detail.related_mistakes.length">
                  <div v-for="rm in detail.related_mistakes" :key="rm.id" class="related-card" @click="switchDetail(rm.id)">
                    <span class="related-question">{{ truncate(rm.question, 40) }}</span>
                    <el-tag size="small" :color="subjectColor(rm.subject_id)" effect="dark" style="color:#fff;border-color:transparent">{{ subjectName(rm.subject_id) }}</el-tag>
                  </div>
                </div>
                <p v-else class="muted">暂无同知识点错题。</p>
              </el-collapse-item>
            </el-collapse>
          </template>
        </div>
        <template #footer>
          <el-button @click="detailVisible = false">关闭</el-button>
          <el-button type="primary" @click="openEdit">编辑</el-button>
          <el-button type="danger" @click="deleteCurrent">删除</el-button>
        </template>
      </el-dialog>

      <el-dialog v-model="editVisible" title="编辑错题" width="780px" top="4vh">
        <mistake-form v-if="editVisible" :initial="editTarget" is-edit @submitted="onEditSubmitted" />
      </el-dialog>
    </div>
  `
};

const MistakeForm = {
  props: {
    initial: { type: Object, default: null },
    isEdit: { type: Boolean, default: false }
  },
  emits: ["submitted"],
  setup(props, { emit }) {
    const formRef = ref(null);
    const submitting = ref(false);
    const tagInput = ref("");
    const approachOptions = ref([]);

    function emptyForm() {
      return {
        subject_id: null,
        sub_subject_id: null,
        question: "",
        option_a: "",
        option_b: "",
        option_c: "",
        option_d: "",
        correct_answer: "A",
        analysis: "",
        difficulty: 3,
        knowledge_tags: [],
        approach: "",
        source: ""
      };
    }

    const form = reactive(emptyForm());

    const rules = {
      subject_id: [{ required: true, message: "请选择科目", trigger: "change" }],
      question: [{ required: true, message: "请输入题干", trigger: "blur" }],
      correct_answer: [{ required: true, message: "请选择正确答案", trigger: "change" }],
      difficulty: [{ required: true, message: "请选择难度", trigger: "change" }]
    };

    const subSubjectOptions = computed(() => {
      if (!form.subject_id) return [];
      return appState.subSubjects.filter((item) => item.subject_id === form.subject_id);
    });

    function fillForm(initial) {
      if (!initial) {
        Object.assign(form, emptyForm());
        return;
      }
      form.subject_id = initial.subject_id;
      form.sub_subject_id = initial.sub_subject_id || null;
      form.question = initial.question || "";
      form.option_a = initial.option_a || "";
      form.option_b = initial.option_b || "";
      form.option_c = initial.option_c || "";
      form.option_d = initial.option_d || "";
      form.correct_answer = initial.correct_answer || "A";
      form.analysis = initial.analysis || "";
      form.difficulty = initial.difficulty || 3;
      form.knowledge_tags = (initial.knowledge_tags || []).slice();
      form.approach = initial.approach || "";
      form.source = initial.source || "";
    }

    watch(() => props.initial, fillForm, { immediate: true });

    function onSubjectChange() {
      form.sub_subject_id = null;
    }

    function addTag() {
      const tag = tagInput.value.trim();
      if (tag && !form.knowledge_tags.includes(tag)) {
        form.knowledge_tags.push(tag);
      }
      tagInput.value = "";
    }

    function flushTag() {
      if (tagInput.value.trim()) addTag();
    }

    function removeTag(tag) {
      form.knowledge_tags = form.knowledge_tags.filter((item) => item !== tag);
    }

    function roundDifficulty(value) {
      form.difficulty = Math.round(value || 0);
    }

    function resetForm() {
      Object.assign(form, emptyForm());
      if (formRef.value) formRef.value.clearValidate();
    }

    async function submitForm() {
      try {
        await formRef.value.validate();
      } catch (err) {
        return;
      }
      submitting.value = true;
      const payload = {
        subject_id: form.subject_id,
        sub_subject_id: form.sub_subject_id || null,
        question: form.question,
        option_a: form.option_a,
        option_b: form.option_b,
        option_c: form.option_c,
        option_d: form.option_d,
        correct_answer: form.correct_answer,
        analysis: form.analysis,
        difficulty: form.difficulty,
        knowledge_tags: form.knowledge_tags,
        approach: form.approach,
        source: form.source
      };
      try {
        let res;
        if (props.isEdit) {
          res = await api.put(`/mistakes/${props.initial.id}`, payload);
        } else {
          res = await api.post("/mistakes", payload);
        }
        ElMessage.success(props.isEdit ? "修改已保存" : "错题已录入");
        emit("submitted", res.data.data);
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "保存失败");
      } finally {
        submitting.value = false;
      }
    }

    async function loadApproachOptions() {
      try {
        const res = await api.get("/mistakes");
        const set = new Set();
        (res.data.data || []).forEach((item) => {
          if (item.approach) set.add(item.approach);
        });
        approachOptions.value = Array.from(set);
      } catch (err) {
        approachOptions.value = [];
      }
    }

    onMounted(loadApproachOptions);

    return {
      formRef,
      form,
      rules,
      submitting,
      tagInput,
      approachOptions,
      subSubjectOptions,
      onSubjectChange,
      addTag,
      flushTag,
      removeTag,
      roundDifficulty,
      resetForm,
      submitForm
    };
  },
  template: `
    <div>
      <el-form ref="formRef" :model="form" :rules="rules" label-width="96px">
        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="科目" prop="subject_id">
              <el-select v-model="form.subject_id" placeholder="请选择科目" style="width:100%" @change="onSubjectChange">
                <el-option v-for="s in appState.subjects" :key="s.id" :label="s.name" :value="s.id" />
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="二级科目">
              <el-select v-model="form.sub_subject_id" placeholder="仅 408 可选" clearable style="width:100%" :disabled="form.subject_id !== 4">
                <el-option v-for="s in subSubjectOptions" :key="s.id" :label="s.name" :value="s.id" />
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>

        <el-form-item label="题干" prop="question">
          <el-input v-model="form.question" type="textarea" :rows="4" placeholder="请输入错题题干" />
        </el-form-item>

        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="选项 A">
              <el-input v-model="form.option_a" placeholder="选项 A 内容" />
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="选项 B">
              <el-input v-model="form.option_b" placeholder="选项 B 内容" />
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="选项 C">
              <el-input v-model="form.option_c" placeholder="选项 C 内容" />
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="选项 D">
              <el-input v-model="form.option_d" placeholder="选项 D 内容" />
            </el-form-item>
          </el-col>
        </el-row>

        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="正确答案" prop="correct_answer">
              <el-radio-group v-model="form.correct_answer">
                <el-radio-button v-for="k in ['A','B','C','D']" :key="k" :value="k">{{ k }}</el-radio-button>
              </el-radio-group>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="难度" prop="difficulty">
              <el-rate v-model="form.difficulty" :max="5" show-score clearable @change="roundDifficulty" />
            </el-form-item>
          </el-col>
        </el-row>

        <el-form-item label="解析">
          <el-input v-model="form.analysis" type="textarea" :rows="3" placeholder="错因分析、考点讲解" />
        </el-form-item>

        <el-form-item label="知识点标签">
          <div class="tag-editor">
            <el-tag v-for="t in form.knowledge_tags" :key="t" closable class="tag-chip" @close="removeTag(t)">{{ t }}</el-tag>
            <el-input v-model="tagInput" placeholder="输入标签后按回车添加" size="small" style="width:230px" @keyup.enter="addTag" @blur="flushTag" />
          </div>
        </el-form-item>

        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="解题思路">
              <el-input v-model="form.approach" list="approach-list" placeholder="如：递归、双指针" />
              <datalist id="approach-list">
                <option v-for="a in approachOptions" :key="a" :value="a" />
              </datalist>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="来源备注">
              <el-input v-model="form.source" placeholder="如：2025 真题" />
            </el-form-item>
          </el-col>
        </el-row>

        <el-form-item>
          <el-button type="primary" :loading="submitting" @click="submitForm">{{ isEdit ? "保存修改" : "提交错题" }}</el-button>
          <el-button v-if="!isEdit" @click="resetForm">清空</el-button>
        </el-form-item>
      </el-form>
    </div>
  `
};

const KnowledgeBase = {
  setup() {
    const loading = ref(false);
    const items = ref([]);
    const filters = reactive({
      subjectId: null,
      tag: ""
    });
    const editVisible = ref(false);
    const saving = ref(false);
    const editing = ref({ id: null, tag_name: "", summary: "" });

    async function loadKnowledge() {
      loading.value = true;
      try {
        const params = {};
        if (filters.subjectId) params.subject_id = filters.subjectId;
        if (filters.tag) params.tag = filters.tag;
        const res = await api.get("/knowledge", { params });
        items.value = res.data.data || [];
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "加载知识点失败");
      } finally {
        loading.value = false;
      }
    }

    function resetFilters() {
      filters.subjectId = null;
      filters.tag = "";
      loadKnowledge();
    }

    function openEdit(row) {
      editing.value = {
        id: row.id,
        tag_name: row.tag_name,
        summary: row.summary || ""
      };
      editVisible.value = true;
    }

    async function saveEdit() {
      saving.value = true;
      try {
        await api.put(`/knowledge/${editing.value.id}`, { summary: editing.value.summary });
        ElMessage.success("知识点已更新");
        editVisible.value = false;
        loadKnowledge();
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "保存失败");
      } finally {
        saving.value = false;
      }
    }

    async function remove(row) {
      try {
        await ElMessageBox.confirm(`确定删除知识点“${row.tag_name}”吗？不影响已关联错题。`, "删除确认", {
          type: "warning",
          confirmButtonText: "删除",
          cancelButtonText: "取消"
        });
      } catch (err) {
        return;
      }
      try {
        await api.delete(`/knowledge/${row.id}`);
        ElMessage.success("删除成功");
        loadKnowledge();
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "删除失败");
      }
    }

    onMounted(loadKnowledge);

    return {
      loading,
      items,
      filters,
      editVisible,
      saving,
      editing,
      loadKnowledge,
      resetFilters,
      openEdit,
      saveEdit,
      remove
    };
  },
  template: `
    <div class="page">
      <div class="page-header">
        <h2>知识点库</h2>
      </div>

      <el-card shadow="never" class="filter-card">
        <el-form :inline="true">
          <el-form-item label="科目">
            <el-select v-model="filters.subjectId" clearable placeholder="全部科目" style="width:180px" @change="loadKnowledge">
              <el-option v-for="s in appState.subjects" :key="s.id" :label="s.name" :value="s.id" />
            </el-select>
          </el-form-item>
          <el-form-item label="标签">
            <el-input v-model="filters.tag" clearable placeholder="搜索知识点标签" style="width:220px" @keyup.enter="loadKnowledge" />
          </el-form-item>
          <el-form-item>
            <el-button type="primary" :loading="loading" @click="loadKnowledge">搜索</el-button>
            <el-button @click="resetFilters">重置</el-button>
          </el-form-item>
        </el-form>
      </el-card>

      <el-card shadow="never">
        <el-table :data="items" v-loading="loading" stripe>
          <el-table-column prop="tag_name" label="标签名" min-width="150" />
          <el-table-column label="所属科目" min-width="150">
            <template #default="{ row }">{{ subjectName(row.subject_id) }}</template>
          </el-table-column>
          <el-table-column label="二级科目" min-width="140">
            <template #default="{ row }">{{ subSubjectName(row.sub_subject_id) || "—" }}</template>
          </el-table-column>
          <el-table-column label="摘要" min-width="300">
            <template #default="{ row }">{{ truncate(row.summary || "（暂无摘要，点击编辑补充）", 80) }}</template>
          </el-table-column>
          <el-table-column label="创建时间" width="175">
            <template #default="{ row }">{{ row.created_at }}</template>
          </el-table-column>
          <el-table-column label="操作" width="140" fixed="right">
            <template #default="{ row }">
              <el-button size="small" type="primary" link @click="openEdit(row)">编辑</el-button>
              <el-button size="small" type="danger" link @click="remove(row)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-card>

      <el-dialog v-model="editVisible" title="编辑知识点摘要" width="600px">
        <el-form label-width="90px">
          <el-form-item label="标签名">
            <el-input :model-value="editing.tag_name" disabled />
          </el-form-item>
          <el-form-item label="摘要">
            <el-input v-model="editing.summary" type="textarea" :rows="8" placeholder="补充该知识点的讲解、易错点、扩展内容" />
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="editVisible = false">取消</el-button>
          <el-button type="primary" :loading="saving" @click="saveEdit">保存</el-button>
        </template>
      </el-dialog>
    </div>
  `
};

const StatsView = {
  setup() {
    const loading = ref(false);
    const stats = ref({ total_mistakes: 0, today_new: 0, by_subject: [] });

    async function loadStats() {
      loading.value = true;
      try {
        const res = await api.get("/stats");
        stats.value = res.data.data;
      } catch (err) {
        ElMessage.error(err.response && err.response.data && err.response.data.message ? err.response.data.message : "加载统计失败");
      } finally {
        loading.value = false;
      }
    }

    function percentOf(count) {
      const max = Math.max(1, ...(stats.value.by_subject || []).map((item) => item.count));
      return Math.round((count / max) * 100);
    }

    onMounted(loadStats);

    return {
      loading,
      stats,
      percentOf
    };
  },
  template: `
    <div class="page" v-loading="loading">
      <div class="page-header">
        <h2>统计</h2>
      </div>

      <div class="stats-cards">
        <div class="stat-card total">
          <div>
            <div class="stat-value">{{ stats.total_mistakes }}</div>
            <div class="stat-label">总错题数</div>
          </div>
        </div>
        <div class="stat-card today">
          <div>
            <div class="stat-value">{{ stats.today_new }}</div>
            <div class="stat-label">今日新增</div>
          </div>
        </div>
      </div>

      <el-card shadow="never" class="subject-stats">
        <template #header><span style="font-weight:700;color:#1d3a5f">各科目统计</span></template>
        <div v-for="s in stats.by_subject" :key="s.subject_id" class="subject-stat-row">
          <div class="subject-name">{{ s.name }}</div>
          <el-progress :percentage="percentOf(s.count)" :stroke-width="14" :show-text="false" :color="subjectColor(s.subject_id)" />
          <div class="subject-nums">
            <span>{{ s.count }} 题</span>
            <span class="avg">平均难度 {{ Number(s.avg_difficulty).toFixed(1) }}</span>
          </div>
        </div>
      </el-card>
    </div>
  `
};

const App = {
  components: { MistakeList, MistakeForm, KnowledgeBase, StatsView },
  setup() {
    const activeMenu = ref("list");

    function handleMenuSelect(index) {
      activeMenu.value = index;
    }

    function onCreated() {
      activeMenu.value = "list";
    }

    onMounted(loadBaseData);

    return {
      activeMenu,
      handleMenuSelect,
      onCreated
    };
  }
};

const app = createApp(App);
app.component("MistakeForm", MistakeForm);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount("#app");
</script>
